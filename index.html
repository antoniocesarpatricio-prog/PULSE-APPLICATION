const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class") e.className=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{
    if(c==null||c===false) return;
    e.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(c) : c);
  });
  return e;
};

const svg = (paths, {w=24,h=24,sw=1.8,lc="round",lj="round",fill="none",stroke}={}) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox",`0 0 ${w} ${h}`);
  s.setAttribute("width",w); s.setAttribute("height",h);
  s.setAttribute("fill",fill);
  if(stroke){s.setAttribute("stroke",stroke);s.setAttribute("stroke-width",sw);s.setAttribute("stroke-linecap",lc);s.setAttribute("stroke-linejoin",lj);}
  paths.forEach(d=>{
    if(d.startsWith("<circle")){
      const m=d.match(/cx="([^"]+)" cy="([^"]+)" r="([^"]+)"/);
      if(m){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",m[1]);c.setAttribute("cy",m[2]);c.setAttribute("r",m[3]);s.appendChild(c);}
    } else if(d.startsWith("<line")){
      const m=d.match(/x1="([^"]+)" y1="([^"]+)" x2="([^"]+)" y2="([^"]+)"/);
      if(m){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",m[1]);l.setAttribute("y1",m[2]);l.setAttribute("x2",m[3]);l.setAttribute("y2",m[4]);s.appendChild(l);}
    } else if(d.startsWith("<polygon")){
      const m=d.match(/points="([^"]+)"/);
      if(m){const p=document.createElementNS("http://www.w3.org/2000/svg","polygon");p.setAttribute("points",m[1]);p.setAttribute("fill",stroke||"#fff");s.appendChild(p);}
    } else {
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",d);s.appendChild(p);
    }
  });
  return s;
};

    dl.appendChild(el("div",{style:{width:"32px",height:"40px",borderRadius:"5px",background:T.muted+"22",border:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:"8px",fontWeight:700,color:T.sub,fontFamily:"'Space Mono',monospace"}},"PDF"));

    aiCard.appendChild(aiHeader);

    if(!state.docAiMsgs) state.docAiMsgs=[];
    if(!state.docAiContext) state.docAiContext=state.company;
    if(state.docAiContext!==state.company){state.docAiMsgs=[];state.docAiContext=state.company;}

    const DOC_REPLIES = {
      revenue:"Based on the verified filing, revenue grew 78% YoY driven primarily by Data Center segment which reached $47.5B. Compute revenue accounted for 87% of total Data Center revenue.",
      profit:"The document reports net income of $29.8B with EPS of $1.19 (diluted). Operating margin expanded to 61.1% from 54.1% the prior year.",
      risk:"Key risks disclosed include: geopolitical restrictions on chip exports, concentration risk in TSMC manufacturing, and competition from custom silicon (AMD, Intel, custom hyperscaler chips).",
      dividend:"The company declared a quarterly cash dividend of $0.01 per share and announced a $25B share repurchase authorization.",

      row.appendChild(bubble);
      msgList.appendChild(row);

    const inputRow = el("div",{style:{display:"flex",gap:"6px"}});

      const q=(aiInput.value||"").trim().toLowerCase();
      if(!q) return;
      const userMsg={role:"user",text:aiInput.value.trim()};
      const reply = q.includes("revenue")||q.includes("sales")?DOC_REPLIES.revenue:
        q.includes("profit")||q.includes("earning")||q.includes("income")?DOC_REPLIES.profit:
        q.includes("risk")?DOC_REPLIES.risk:
        q.includes("dividend")||q.includes("buyback")||q.includes("repurchase")?DOC_REPLIES.dividend:DOC_REPLIES.default;
      const aiMsg={role:"ai",text:reply};
      if(!state.docAiMsgs) state.docAiMsgs=[];
      state.docAiMsgs.push(userMsg,aiMsg);
      state.compSec="report";
      render();
    };
    sendBtn.addEventListener("click",handleAsk);
    aiInput.addEventListener("keydown",(e)=>{if(e.key==="Enter") handleAsk();});
    inputRow.appendChild(aiInput);
    inputRow.appendChild(sendBtn);
    aiCard.appendChild(inputRow);
    body.appendChild(aiCard);
  }


  wrap.appendChild(body);
  wrap.appendChild(el("div",{style:{height:"14px"}}));
  return wrap;
};

        ar.appendChild(el("span",{style:{fontSize:"10px",fontWeight:700,color:T.text}},m.user));
        if(m.cert) ar.appendChild(CertBadge());
        if(m.role) ar.appendChild(el("span",{style:{fontSize:"8px",color:T.sub,fontFamily:"'Space Mono',monospace"}},m.role));
        mw.appendChild(ar);
      }
      const mb = el("div",{style:{maxWidth:"80%",padding:"9px 12px",borderRadius:isMe?"14px 14px 4px 14px":"4px 14px 14px 14px",background:isMe?T.acc:T.card,border:isMe?"none":`1px solid ${T.border}`}});
      mb.appendChild(el("div",{style:{fontSize:"12px",color:isMe?T.bg:T.text,lineHeight:1.55}},m.txt));
      mw.appendChild(mb);
      mw.appendChild(el("span",{style:{fontSize:"8px",color:T.muted,fontFamily:"'Space Mono',monospace"}},m.time));
      ml.appendChild(mw);
    });
    const endAnchor = el("div"); ml.appendChild(endAnchor);
    wrap.appendChild(ml);
    setTimeout(()=>endAnchor.scrollIntoView(),50);

    const inp = el("div",{style:{padding:"8px 10px",borderTop:`1px solid ${T.border}`,display:"flex",gap:"6px",flexShrink:0,background:T.surf}});
    const tf = el("input",{style:{flex:1,background:T.inp,border:`1px solid ${T.border}`,borderRadius:"10px",padding:"8px 11px",color:T.text,fontSize:"11px"},placeholder:"Your take..."});
    tf.value = state.convDraft;
    tf.addEventListener("input",e=>state.convDraft=e.target.value);
    tf.addEventListener("keydown",e=>{
      if(e.key==="Enter"&&tf.value.trim()){
        if(!state.convMsgs[conv.id]) state.convMsgs[conv.id]=[...conv.msgs];
        state.convMsgs[conv.id].push({user:"You",cert:false,img:null,role:null,time:"now",txt:tf.value.trim()});
        state.convDraft=""; render();
      }
    });
    inp.appendChild(tf);
    const sb = el("button",{style:{width:"34px",height:"34px",borderRadius:"10px",background:T.acc,border:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}});
    const si = ICONS.send(T.bg); si.setAttribute("width","13"); si.setAttribute("height","13");
    sb.appendChild(si);
    sb.addEventListener("click",()=>{
      const v=(tf.value||state.convDraft||"").trim();
      if(v){if(!state.convMsgs[conv.id])state.convMsgs[conv.id]=[...conv.msgs];state.convMsgs[conv.id].push({user:"You",cert:false,img:null,role:null,time:"now",txt:v});state.convDraft="";render();}
    });
    inp.appendChild(sb);
    wrap.appendChild(inp);
    return wrap;
  }

  // List view
  const wrap = el("div",{style:{height:"100%",overflowY:"auto",padding:"14px"}});
  // Back button
  const convBackBtn = el("button",{style:{background:"none",border:"none",padding:0,cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",marginBottom:"10px"}});
  const convBackIc = ICONS.back(T.sub); convBackIc.setAttribute("width","16"); convBackIc.setAttribute("height","16");
  convBackBtn.appendChild(convBackIc);
  convBackBtn.addEventListener("click",()=>{state.page="news";render();});
  wrap.appendChild(convBackBtn);
  wrap.appendChild(el("div",{style:{fontSize:"8px",color:T.muted,fontFamily:"'Space Mono',monospace",letterSpacing:"0.1em",marginBottom:"2px"}},"DISCUSSIONS"));
  wrap.appendChild(el("div",{style:{fontSize:"22px",fontWeight:900,color:T.text,letterSpacing:"-1px",marginBottom:"4px"}},"Conversations"));
  wrap.appendChild(el("div",{style:{fontSize:"10px",color:T.sub,marginBottom:"14px",lineHeight:1.5}},"Canaux créés par les influenceurs top-ranked — analyses, conférences & accès exclusifs."));

  const buildList = (items, label) => {
    wrap.appendChild(el("div",{style:{fontSize:"8px",color:T.muted,fontFamily:"'Space Mono',monospace",marginBottom:"8px",letterSpacing:"0.08em"}},label));
    const list = el("div",{style:{display:"flex",flexDirection:"column",gap:"1px",marginBottom:"16px"}});
    items.forEach((conv,i)=>{
      const row = el("div",{style:{background:T.card,borderRadius:i===0?"14px 14px 0 0":i===items.length-1?"0 0 14px 14px":"0",borderBottom:`1px solid ${T.border}`,padding:"11px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:"11px",transition:"background .15s"}});
      row.addEventListener("mouseenter",()=>row.style.background=T.surf);
      row.addEventListener("mouseleave",()=>row.style.background=T.card);
      row.addEventListener("click",()=>{state.convOpen=conv.id;render();});

      const avWrap = el("div",{style:{position:"relative",flexShrink:0}});
      avWrap.appendChild(Avatar(conv.img,conv.name,42,"50%"));
      if(conv.cert){
        const cb = el("div",{style:{position:"absolute",bottom:"-1px",right:"-1px"}});
        cb.appendChild(CertBadge());
        avWrap.appendChild(cb);
      }
      row.appendChild(avWrap);

      const rd = el("div",{style:{flex:1,minWidth:0}});
      const rn = el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px"}});
      rn.appendChild(el("span",{style:{fontSize:"13px",fontWeight:700,color:T.text}},conv.name));
      rn.appendChild(el("span",{style:{fontSize:"8px",color:T.muted,fontFamily:"'Space Mono',monospace"}},conv.lastTime));
      rd.appendChild(rn);
      rd.appendChild(el("div",{style:{fontSize:"8px",color:T.sub,fontFamily:"'Space Mono',monospace",marginBottom:"3px"}},`${conv.members.toLocaleString()} membres · ${conv.role}`));
      rd.appendChild(el("div",{style:{fontSize:"11px",color:T.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},conv.last));
      row.appendChild(rd);

      if(conv.unread>0){
        const ub = el("div",{style:{width:"18px",height:"18px",borderRadius:"50%",background:T.acc,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}});
        ub.appendChild(el("span",{style:{fontSize:"9px",fontWeight:800,color:T.bg}},conv.unread));
        row.appendChild(ub);
      }
      list.appendChild(row);
    });
    wrap.appendChild(list);
  };

  buildList(CONVS,"CANAUX INFLUENCEURS");
  wrap.appendChild(el("div",{style:{height:"14px"}}));
  return wrap;
};

// ── AI SIDE TAB ───────────────────────────────────────────────────────────────
const buildAITab = () => {
  const AI_REPLIES = {
    nvidia:"Nvidia's potential acquisition by a sovereign wealth fund would be historic. The $2.5T valuation sets a new precedent. Sovereign funds seek stable long-term assets — for Nvidia, stable capital but geopolitical risk. Markets are pricing in a ~12% premium.",
    apple:"Vision Pro 2 with M4 Ultra is a significant platform bet. Apple's strength is ecosystem lock-in — on-device AI agents could reframe Vision Pro as an enterprise productivity tool, not just a luxury gadget.",
    tesla:"The Hertz cancellation is a concrete demand signal. Fleet operators are the canary in the EV market. TCO is still not competitive with ICE at scale. Bearish short-term.",
    default:"Good question. In markets, every piece of information is a signal — the key is separating noise from real alpha. Ask me about a specific ticker or macro event.",
  };

  if(!state.aiOpen){
    const btn = el("button",{style:{position:"absolute",bottom:"72px",right:0,width:"36px",height:"36px",borderRadius:"9px 0 0 9px",background:T.surf,border:`1px solid ${T.border}`,borderRight:"none",display:"flex",alignItems:"center",justifyContent:"center",zIndex:20,boxShadow:"0 2px 8px rgba(0,0,0,.25)"}});
    const ic = ICONS.bulb(T.sub); ic.setAttribute("width","15"); ic.setAttribute("height","15");
    btn.appendChild(ic);
    btn.addEventListener("click",()=>{state.aiOpen=true;render();});
    return btn;
  }

  const panel = el("div",{style:{position:"absolute",bottom:"68px",right:0,width:"292px",height:"360px",background:T.card,borderRadius:"14px 0 0 14px",border:`1px solid ${T.border}`,borderRight:"none",display:"flex",flexDirection:"column",zIndex:20,boxShadow:"0 20px 60px rgba(0,0,0,.3)"},class:"anim-su"});

  const hdr = el("div",{style:{padding:"11px 13px",borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",borderRadius:"14px 0 0 0"}});
  const hl = el("div",{style:{display:"flex",gap:"7px",alignItems:"center"}});
  const aib = el("div",{style:{width:"26px",height:"26px",borderRadius:"7px",background:T.muted+"22",border:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center"}});
  const aii = ICONS.bulb(T.sub); aii.setAttribute("width","14"); aii.setAttribute("height","14");
  aib.appendChild(aii); hl.appendChild(aib);
  const aid = el("div");
  aid.appendChild(el("div",{style:{fontSize:"12px",fontWeight:800,color:T.text}},"PULSE AI"));
  aid.appendChild(el("div",{style:{fontSize:"7px",color:T.green,fontFamily:"'Space Mono',monospace",letterSpacing:"0.06em"}},"ONLINE"));
  hl.appendChild(aid); hdr.appendChild(hl);
  const xb = el("button",{style:{background:"none",border:"none",cursor:"pointer",padding:"3px"}});
  const xi = ICONS.x(T.muted); xi.setAttribute("width","13"); xi.setAttribute("height","13");
  xb.appendChild(xi); xb.addEventListener("click",()=>{state.aiOpen=false;render();}); hdr.appendChild(xb);
  panel.appendChild(hdr);

  const ml = el("div",{style:{flex:1,overflowY:"auto",padding:"10px 12px",display:"flex",flexDirection:"column",gap:"8px"}});
  state.aiMsgs.forEach(m=>{
    const isMe = m.r==="user";
    const bub = el("div",{style:{display:"flex",justifyContent:isMe?"flex-end":"flex-start"}});
    const mb = el("div",{style:{maxWidth:"82%",padding:"8px 11px",borderRadius:isMe?"14px 14px 4px 14px":"4px 14px 14px 14px",background:isMe?T.acc:T.inp,border:isMe?"none":`1px solid ${T.border}`}});
    mb.appendChild(el("div",{style:{fontSize:"11px",color:isMe?T.bg:T.text,lineHeight:1.55}},m.t));
    bub.appendChild(mb);
    ml.appendChild(bub);
  });
  if(state.aiTyping){
    const tb = el("div",{style:{display:"flex",justifyContent:"flex-start"}});
    const td = el("div",{style:{padding:"8px 14px",borderRadius:"4px 14px 14px 14px",background:T.inp,border:`1px solid ${T.border}`,display:"flex",gap:"4px",alignItems:"center"}});
    [0,1,2].forEach(i=>{const d=el("div",{style:{width:"4px",height:"4px",borderRadius:"50%",background:T.sub,animation:`lp 1s ${i*.2}s ease-in-out infinite`}});td.appendChild(d);});
    tb.appendChild(td); ml.appendChild(tb);
  }
  const endRef = el("div"); ml.appendChild(endRef);
  panel.appendChild(ml);
  setTimeout(()=>endRef.scrollIntoView(),50);

  const inp = el("div",{style:{padding:"8px 10px",borderTop:`1px solid ${T.border}`,display:"flex",gap:"6px"}});
  const tf = el("input",{style:{flex:1,background:T.inp,border:`1px solid ${T.border}`,borderRadius:"9px",padding:"7px 10px",color:T.text,fontSize:"11px"},placeholder:"Ask about a ticker..."});
  tf.value = state.aiDraft;
  tf.addEventListener("input",e=>state.aiDraft=e.target.value);
  const doSend = () => {
    const v=(tf.value||state.aiDraft||"").trim();
    if(!v) return;
    state.aiMsgs.push({r:"user",t:v}); state.aiDraft=""; state.aiTyping=true;
    render();
    const q=v.toLowerCase();
    const reply=q.includes("nvidia")||q.includes("nvda")?AI_REPLIES.nvidia:q.includes("apple")||q.includes("aapl")?AI_REPLIES.apple:q.includes("tesla")||q.includes("tsla")?AI_REPLIES.tesla:AI_REPLIES.default;
    setTimeout(()=>{state.aiTyping=false;state.aiMsgs.push({r:"ai",t:reply});render();},1100);
  };
  tf.addEventListener("keydown",e=>{if(e.key==="Enter")doSend();});
  inp.appendChild(tf);
  const sb = el("button",{style:{width:"30px",height:"30px",borderRadius:"8px",background:T.acc,border:"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}});
  const si = ICONS.send(T.bg); si.setAttribute("width","12"); si.setAttribute("height","12");
  sb.appendChild(si); sb.addEventListener("click",doSend);
  inp.appendChild(sb); panel.appendChild(inp);
  return panel;
};

// ── START ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
